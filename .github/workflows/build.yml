name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Scaffold Android project
        run: |
          flutter create --platforms=android --org com.bcsplanner --project-name bcs_planner /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: Update Kotlin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '[0-9.]*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true

      - name: Patch AndroidManifest
        run: python3 tool/patch_manifest.py

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bcs-planner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
